<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-icone.svg') }}">
  <title>Contratação recebida | ADVOGO SEGURO</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background:var(--cinza-claro);">

<main class="container-narrow" style="padding:70px 20px;max-width:720px;">
  <div class="panel" style="text-align:center;">

    <div style="font-size:3rem;">🛡️</div>

    <h1>Contratação recebida</h1>

    <div id="alertaSucesso" class="alert-box show alert-sucesso">
      Validando o pagamento e ativando sua assinatura...
    </div>

    <p id="avisoPendente" style="color:var(--texto-suave);line-height:1.7;">
      A assinatura será liberada após a confirmação segura do pagamento pelo provedor.
    </p>

    <a
      href="/escritorio/painel"
      class="btn-spy btn-spy-primary"
      id="btnPainel"
      style="display:none;"
    >
      Acessar o painel
    </a>

  </div>
</main>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>

<script>
Auth.requireTipo('escritorio', '/escritorio/login');

const sessionId = new URLSearchParams(window.location.search).get('session_id');

// Status Stripe em que o acesso ao plano já está liberado.
const STATUS_ASSINATURA_LIBERADA = ['active', 'trialing'];

async function sincronizar() {

  if (!sessionId) {
    showAlert(
      'alertaSucesso',
      'Sessão de pagamento não identificada.',
      'erro'
    );
    return;
  }

  try {

    const data = await apiRequest(
      '/api/comercial/checkout/sincronizar',
      {
        method: 'POST',
        body: {
          session_id: sessionId
        }
      }
    );

    if (data.ok && STATUS_ASSINATURA_LIBERADA.includes(data.assinatura_status)) {

      showAlert(
        'alertaSucesso',
        'Pagamento confirmado. Sua assinatura está ativa e o acesso ao plano já foi liberado.',
        'sucesso'
      );

      // Com o plano já ativo, o aviso de liberação futura seria contraditório.
      document.getElementById('avisoPendente').hidden = true;

      Auth.setSession(
        null,
        'escritorio',
        Auth.getNome(),
        data.plano
      );

      document.getElementById('btnPainel').style.display = 'inline-flex';

    } else {

      // Pagamento ainda pendente de confirmação: mantém o aviso de liberação.
      showAlert(
        'alertaSucesso',
        data.erro || 'A ativação da assinatura ainda está sendo processada.',
        'sucesso'
      );

    }

  } catch (err) {

    showAlert(
      'alertaSucesso',
      err.message,
      'erro'
    );

  }
}

sincronizar();
</script>

</body>
</html>
