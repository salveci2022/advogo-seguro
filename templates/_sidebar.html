<script>
(function () {
  window.renderizarPlanoSidebar = function (plano) {
    const tag = document.getElementById('planoTag');
    if (!tag || !plano) return;

    const uso = plano.limite_advogados === null
      ? `${plano.advogados_ativos} ativos`
      : `${plano.advogados_ativos}/${plano.limite_advogados}`;

    tag.textContent = `PLANO: ${plano.nome.toUpperCase()} • ${uso}`;
    tag.title = plano.plano_ativo
      ? 'Plano ativo'
      : 'Plano inativo ou vencido';
  };

  window.atualizarPlanoSidebar = async function () {
    const tag = document.getElementById('planoTag');
    if (!tag || typeof Auth === 'undefined') return;

    const token = Auth.getToken();
    if (!token) return;

    try {
      const resposta = await fetch('/api/escritorio/plano?ts=' + Date.now(), {
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-store'
      });

      if (!resposta.ok) return;

      const plano = await resposta.json();
      window.renderizarPlanoSidebar(plano);
    } catch (erro) {
      tag.textContent = 'PLANO: NÃO DISPONÍVEL';
    }
  };

  window.addEventListener('DOMContentLoaded', window.atualizarPlanoSidebar);
})();
</script>
